:root{
  --bg:#f6f8fb; --surface:#ffffff; --fg:#14213a; --muted:#56627a; --line:#dbe2ec; --soft:#eaf0f8;
  --accent:#1f5fbf; --accent-ink:#ffffff; --accent-soft:#e3ecfa;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;

  --cds-chart-categorical-5:#e8749f; --cds-chart-categorical-6:#d9b23c; --cds-chart-categorical-7:#a483e6; --cds-chart-categorical-8:#6fb7c4;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.6}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--fg);font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;margin-right:auto}
.brand small{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs a{text-decoration:none;color:var(--muted);font-weight:600;padding:6px 12px;border-radius:8px;font-size:15px}
.tabs a:hover{color:var(--fg);background:var(--soft)}
.tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:12.5px;padding:6px 10px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
.doc{display:grid;grid-template-columns:230px minmax(0,1fr);gap:48px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);font-size:14.5px}
.toc h2{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:500}
.toc ol{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
.toc a{display:block;padding:5px 0 5px 14px;margin-left:-1px;border-left:2px solid transparent;color:var(--muted);text-decoration:none;line-height:1.35}
.toc a:hover{color:var(--fg)}
.toc a.on{color:var(--accent);border-left-color:var(--accent);font-weight:600}
article{min-width:0;max-width:820px}
article h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,4vw,42px);line-height:1.1;letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.kicker{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
article h2{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.01em;line-height:1.2;margin:56px 0 14px;padding-top:16px;border-top:1px solid var(--line);text-wrap:balance;scroll-margin-top:90px}
article h3{font-size:19px;margin:32px 0 10px;scroll-margin-top:90px}
article p,article li{max-width:68ch}
article ul,article ol{padding-left:22px}
article li{margin:4px 0}
.tbl{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font-size:13px;letter-spacing:.03em;color:var(--muted);background:var(--soft);font-weight:600}
tr:last-child td{border-bottom:0}
figure.w{position:relative;margin:22px 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 10px}
figure.w .mount{overflow-x:auto}
figure.w svg{display:block;width:100%;min-width:620px;height:auto}
figure.w figcaption{font-size:13px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.live{position:absolute;top:-10px;right:14px;font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:3px 8px;border-radius:6px}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:end;padding-block:12px 32px;border-bottom:1px solid var(--line)}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,5.4vw,58px);line-height:1.05;letter-spacing:-.025em;margin:0 0 16px;text-wrap:balance}
.hero p.lead{font-size:19px;color:var(--muted);max-width:56ch;margin:0}
.figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.figs div{background:var(--surface);padding:14px 16px}
.figs b{display:block;font-family:var(--f-display);font-size:30px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.figs b small{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-weight:500;margin-left:4px;letter-spacing:0}
.figs span{font-size:14px;color:var(--muted);line-height:1.35;display:block;margin-top:6px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:32px}
.card{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .kicker{margin:0}
.card h2{font-family:var(--f-display);font-size:24px;margin:0;letter-spacing:-.01em}
.card p{margin:0;color:var(--muted);font-size:16px}
.card ul{margin:6px 0 0;padding-left:18px;font-size:15px;color:var(--muted)}
.card .go{margin-top:auto;padding-top:8px;font-weight:600;color:var(--accent)}
.note{margin-top:32px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;font-size:15px;color:var(--muted)}
.note h3{font-size:13px;font-family:var(--f-mono);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--fg);margin:0 0 6px}
.note p{margin:0}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
footer .wrap{padding-block:18px;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
@media (max-width:900px){
  .doc{grid-template-columns:minmax(0,1fr);gap:8px}
  .toc{position:static;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .hero,.cards,.note{grid-template-columns:minmax(0,1fr)}
  .hero{gap:24px}
}
@media (max-width:520px){ body{font-size:16px} .tabs a{padding:6px 8px;font-size:14px} .brand small{display:none} }
@media (prefers-reduced-motion:reduce){ .card{transition:none} .card:hover{transform:none} }
</style>

      <article><div id="body-funciona"></div></article>
    </div>
  </section>
</main>

var CONTENT={"es": {"funciona": "<div class=\"tbl\"><table><tr><th>Bloque<\/th><th>ECTS<\/th><th>Cuándo<\/th><\/tr><tr><td>Formación básica<\/td><td>60<\/td><td>1.º<\/td><\/tr><tr><td>Obligatorias comunes<\/td><td>87<\/td><td>2.º y 3.º<\/td><\/tr><tr><td>Mención y optativas<\/td><td>87<\/td><td>3.º y 4.º<\/td><\/tr><tr><td>Trabajo de Fin de Grado<\/td><td>6<\/td><td>4.º, primavera<\/td><\/tr><\/table><\/div>\n<p><em>Documento basado en la propuesta provisional del 23/09/2026. Los temarios, la evaluación y algunas optativas aún se están debatiendo.<\/em><\/p>\n<h2 id=\"f-mapa-del-grado\">Mapa del grado<\/h2>\n<figure class=\"w\" data-w=\"mapa\"><div class=\"mount\"><\/div><figcaption>Propuesta del 23/09/2026 · 8 semestres, 240 ECTS<\/figcaption><\/figure>\n<p>Cada laboratorio es una asignatura independiente de 3 ECTS que se matricula aparte de la teoría: Lab Ia, Ib e Ic en 2.º (Mecánica, EM y Termodinámica) y Lab IIa e IIb en 3.º (Óptica y Cuántica). Qué laboratorio ocupa cada franja está por decidir.<\/p>\n<h2 id=\"f-las-materias-troncales\">Las materias troncales<\/h2>\n<figure class=\"w\" data-w=\"tronc\"><div class=\"mount\"><\/div><figcaption>Propuesta del 23/09/2026 · materias del tronco común, semestres 1–6<\/figcaption><\/figure>\n<ul><li><strong>Fonaments<\/strong> son un primer contacto más cualitativo con toda la física clásica.<\/li><li><strong>Mecánica y Electromagnetismo<\/strong> pasan de 7,5 a 12 ECTS de teoría: Mecánica conserva todo su contenido actual y gana profundidad; EM absorbe parte de lo que deja Fonaments y amplía ondas y propagación.<\/li><li><strong>Óptica y Termodinámica<\/strong> pasan a 9 ECTS de teoría.<\/li><li><strong>Cuántica II<\/strong> (≈ la actual Mecànica Quàntica) pasa a ser común.<\/li><li>Cada laboratorio vale <strong>3 ECTS<\/strong> y se matricula aparte.<\/li><\/ul>\n<h2 id=\"f-laboratorios\">Laboratorios<\/h2>\n<figure class=\"w\" data-w=\"labs\"><div class=\"mount\"><\/div><figcaption>Propuesta del 23/09/2026; la progresión de autonomía es una propuesta en debate<\/figcaption><\/figure>\n<p>Cada laboratorio es una asignatura propia de 3 ECTS, no anual, para que quien repite una asignatura no quede descuadrado. Requisito previsto: estar matriculado o haber superado la teoría correspondiente. La franja de cada laboratorio y el reparto de prácticas aún se están decidiendo.<\/p>\n<h2 id=\"f-como-se-construye-una-mencion\">Cómo se construye una mención<\/h2>\n<figure class=\"w\" data-w=\"mencio\"><div class=\"mount\"><\/div><figcaption>Propuesta del 23/09/2026 · estructura del espacio optativo<\/figcaption><\/figure>\n<h2 id=\"f-las-cinco-menciones\">Las cinco menciones<\/h2>\n<div class=\"tbl\"><table><tr><th>Mención<\/th><th>Obligatorias de mención<\/th><th>ECTS<\/th><th>Optativas mín.<\/th><\/tr><tr><td><strong>Astrofísica<\/strong><\/td><td>Mecànica Teòrica · Relativitat Especial i Camps Clàssics · Astrofísica estel·lar · Física Atòmica i Molecular · Astrofísica galàctica i extragalàctica · Plasmes i Processos Astrofísics · Astrofísica observacional · Cosmologia<\/td><td>39<\/td><td>21<\/td><\/tr><tr><td><strong>Física del Sistema Terra<\/strong><\/td><td>Física de medis continus · Física de l’atmosfera · Geofísica · Dinàmica de fluids geofísics · Geodinàmica · Fon. Científics del Canvi Climàtic · Sistemes complexos i física interdisciplinària<\/td><td>36<\/td><td>24<\/td><\/tr><tr><td><strong>Matèria Condensada i Sistemes Complexos<\/strong><\/td><td>Física de medis continus · Mecànica Teòrica · Física de l’Estat Sòlid · Fenòmens Col·lectius i Transicions de Fase · Lab. Estat Sòlid · Sistemes Fora de l’Equilibri · Sistemes complexos i física interdisciplinària<\/td><td>39<\/td><td>21<\/td><\/tr><tr><td><strong>Quàntica i Interaccions Fonamentals<\/strong><\/td><td>Relativitat Especial i Camps Clàssics · Mecànica Teòrica · Física Atòmica i Molecular · Física Nuclear i Hadrònica · Física de Partícules · Laboratori de menció<\/td><td>36<\/td><td>24<\/td><\/tr><tr><td><strong>Tecnologies Físiques<\/strong><\/td><td>Instrumentació Física · Física de l’Estat Sòlid · Física Atòmica i Molecular · Fotònica · Física de Semiconductors · Laboratori de Tecnologies Físiques<\/td><td>36<\/td><td>24<\/td><\/tr><\/table><\/div>\n<p>Muchas asignaturas se repiten entre menciones (Mecànica Teòrica en tres, Física Atòmica i Molecular en tres). Eso es lo que permite cambiar de mención sin perder créditos.<\/p>\n<p>Abreviaturas usadas más abajo: <strong>Astro<\/strong> = Astrofísica · <strong>Terra<\/strong> = Física del Sistema Terra · <strong>MCSC<\/strong> = Matèria Condensada i Sistemes Complexos · <strong>QIF<\/strong> = Quàntica i Interaccions Fonamentals · <strong>TF<\/strong> = Tecnologies Físiques.<\/p>\n<figure class=\"w\" data-w=\"menmap\"><span class=\"live\">interactivo<\/span><div class=\"mount\"><\/div><figcaption>Mapa del grado con las obligatorias de cada mención en 3.º y 4.º. Las optativas incluyen las de mención, las de otras menciones y las transversales.<\/figcaption><\/figure>\n<figure class=\"w\" data-w=\"menopt\"><span class=\"live\">interactivo<\/span><div class=\"mount\"><\/div><figcaption>Optativas propias de cada mención; las que son obligatorias en otra mención lo indican.<\/figcaption><\/figure>\n<h3 id=\"f-que-comparten-las-menciones\">Qué comparten las menciones<\/h3>\n<figure class=\"w\" data-w=\"euler\"><span class=\"live\">interactivo<\/span><div class=\"mount\"><\/div><figcaption>Diagrama de Euler a partir de las tablas de mención del 23/09/2026 · 46 asignaturas; posiciones verificadas para que cada asignatura quede solo dentro de los conjuntos a los que pertenece<\/figcaption><\/figure>\n<p>Cómo leerlo: pulsa las menciones de la leyenda para mostrar solo las que quieras comparar (por ejemplo, Astrofísica y Quàntica); las asignaturas que no pertenecen a ninguna seleccionada quedan en gris y el contador indica cuántas comparten. Cada asignatura está dentro de los contornos de todas las menciones a las que pertenece. Si además cae en la zona sombreada de una mención, es obligatoria en ella. Atòmica i Molecular, en el centro, está en las cinco.<\/p>\n<figure class=\"w\" data-w=\"red\"><div class=\"mount\"><\/div><figcaption>Tablas de mención de la presentación del 23/09/2026 · 46 asignaturas de mención<\/figcaption><\/figure>\n<figure class=\"w\" data-w=\"matriz\"><span class=\"live\">interactivo<\/span><div class=\"mount\"><\/div><figcaption>Tablas de mención de la presentación del 23/09/2026; “Mètodes Matemàtics Avançats” de Terra se asigna a MMA I<\/figcaption><\/figure>\n<p>Las asignaturas de arriba son las que conectan menciones: Física Atòmica i Molecular está en las cinco y Mecànica Teòrica en cuatro. Las de abajo son las que dan identidad a cada una. Pulsa una mención (en los botones o en la cabecera de su columna) para ordenar la tabla desde ella: arriba salen sus obligatorias, y la fila de resumen indica cuántos de esos ECTS cuentan también en cada una de las otras menciones.<\/p>\n<p>Además de las 46 asignaturas de mención hay <strong>optativas transversales<\/strong>, que no pertenecen a ninguna mención y cuentan como créditos libres: Història de la Física (6), Pràctiques en Empresa (6), Gènere, Ciència i Tecnologia (3) y, por confirmar, Didàctica de la Ciència (3). Fonaments Científics del Canvi Climàtic (3), obligatoria en Terra, también se ofrece como transversal.<\/p>\n<h2 id=\"f-cambiar-de-mencion\">Cambiar de mención<\/h2>\n<figure class=\"w\" data-w=\"viab\"><span class=\"live\">interactivo<\/span><div class=\"mount\"><\/div><figcaption>Calculado a partir de las tablas de mención e itinerarios de la presentación del 23/09/2026; no incluye las optativas de 3.º<\/figcaption><\/figure>\n<ul><li><strong>Cómo leerla:<\/strong> pulsa el botón del momento del cambio (tras el 5.º o tras el 6.º semestre). Fila = mención en la que empezó el estudiante; columna = a la que quiere cambiar. Cada celda dice cuántos ECTS de las asignaturas fijas de mención ya cursadas siguen contando. Pasa el ratón por encima de una celda (o tócala) para ver debajo qué asignaturas cuentan, si como obligatoria u optativa del destino, y cuáles no.<\/li><li><strong>Tras el 5.º semestre<\/strong> el cambio es viable en las 20 combinaciones: solo se han cursado 6–12 ECTS de mención y quedan 75 ECTS optativos.<\/li><li><strong>Tras el 6.º semestre<\/strong> es viable en 18 de 20: solo fallan Terra → QIF y Terra → TF.<\/li><li>Lo que no cuenta para la nueva mención no se pierde: va a los 27 ECTS libres.<\/li><li>Si el cambio llega tarde y no se completan los 60 ECTS, queda el <strong>itinerario libre<\/strong>: se obtiene el título con los mismos conocimientos, sin el nombre de la mención.<\/li><li>Las optativas de 3.º que elija el estudiante pueden mejorar mucho estas cifras si ya duda entre dos menciones.<\/li><\/ul>\n", "ftoc": [["f-mapa-del-grado", "Mapa del grado"], ["f-las-materias-troncales", "Las materias troncales"], ["f-laboratorios", "Laboratorios"], ["f-como-se-construye-una-mencion", "Cómo se construye una mención"], ["f-las-cinco-menciones", "Las cinco menciones"], ["f-cambiar-de-mencion", "Cambiar de mención"]]}, "ca": {"funciona": "<div class=\"tbl\"><table><tr><th>Bloc<\/th><th>ECTS<\/th><th>Quan<\/th><\/tr><tr><td>Formació bàsica<\/td><td>60<\/td><td>1r<\/td><\/tr><tr><td>Obligatòries comunes<\/td><td>87<\/td><td>2n i 3r<\/td><\/tr><tr><td>Menció i optatives<\/td><td>87<\/td><td>3r i 4t<\/td><\/tr><tr><td>Treball de Fi de Grau<\/td><td>6<\/td><td>4t, primavera<\/td><\/tr><\/table><\/div>\n<p><em>Document basat en la proposta provisional del 23/09/2026. Els temaris, l’avaluació i algunes optatives encara s’estan debatent.<\/em><\/p>\n<h2 id=\"f-mapa-del-grau\">Mapa del grau<\/h2>\n<figure class=\"w\" data-w=\"mapa\"><div class=\"mount\"><\/div><figcaption>Mapa del grau per semestres<\/figcaption><\/figure>\n<p>Cada laboratori és una assignatura independent de 3 ECTS que es matricula a banda de la teoria: Lab Ia, Ib i Ic a 2n (Mecànica, EM i Termodinàmica) i Lab IIa i IIb a 3r (Òptica i Quàntica). Quin laboratori ocupa cada franja està per decidir.<\/p>\n<h2 id=\"f-les-materies-troncals\">Les matèries troncals<\/h2>\n<figure class=\"w\" data-w=\"tronc\"><div class=\"mount\"><\/div><figcaption>Matèries troncals: teoria i laboratori<\/figcaption><\/figure>\n<ul><li><strong>Fonaments<\/strong> són un primer contacte més qualitatiu amb tota la física clàssica.<\/li><li><strong>Mecànica i Electromagnetisme<\/strong> passen de 7,5 a 12 ECTS de teoria: Mecànica conserva tot el contingut actual i guanya profunditat; EM absorbeix part del que deixa Fonaments i amplia ones i propagació.<\/li><li><strong>Òptica i Termodinàmica<\/strong> passen a 9 ECTS de teoria.<\/li><li><strong>Quàntica II<\/strong> (≈ l’actual Mecànica Quàntica) passa a ser comuna.<\/li><li>Cada laboratori val <strong>3 ECTS<\/strong> i es matricula a banda.<\/li><\/ul>\n<h2 id=\"f-laboratoris\">Laboratoris<\/h2>\n<figure class=\"w\" data-w=\"labs\"><div class=\"mount\"><\/div><figcaption>Itinerari de laboratori<\/figcaption><\/figure>\n<p>Cada laboratori és una assignatura pròpia de 3 ECTS, no anual, perquè qui repeteix una assignatura no quedi desquadrat. Requisit previst: estar matriculat o haver superat la teoria corresponent. La franja de cada laboratori i el repartiment de pràctiques encara s’estan decidint.<\/p>\n<h2 id=\"f-com-es-construeix-una-mencio\">Com es construeix una menció<\/h2>\n<figure class=\"w\" data-w=\"mencio\"><div class=\"mount\"><\/div><figcaption>Composició d&#x27;una menció<\/figcaption><\/figure>\n<h2 id=\"f-les-cinc-mencions\">Les cinc mencions<\/h2>\n<div class=\"tbl\"><table><tr><th>Menció<\/th><th>Obligatòries de menció<\/th><th>ECTS<\/th><th>Optatives mín.<\/th><\/tr><tr><td><strong>Astrofísica<\/strong><\/td><td>Mecànica Teòrica · Relativitat Especial i Camps Clàssics · Astrofísica estel·lar · Física Atòmica i Molecular · Astrofísica galàctica i extragalàctica · Plasmes i Processos Astrofísics · Astrofísica observacional · Cosmologia<\/td><td>39<\/td><td>21<\/td><\/tr><tr><td><strong>Física del Sistema Terra<\/strong><\/td><td>Física de medis continus · Física de l’atmosfera · Geofísica · Dinàmica de fluids geofísics · Geodinàmica · Fon. Científics del Canvi Climàtic · Sistemes complexos i física interdisciplinària<\/td><td>36<\/td><td>24<\/td><\/tr><tr><td><strong>Matèria Condensada i Sistemes Complexos<\/strong><\/td><td>Física de medis continus · Mecànica Teòrica · Física de l’Estat Sòlid · Fenòmens Col·lectius i Transicions de Fase · Lab. Estat Sòlid · Sistemes Fora de l’Equilibri · Sistemes complexos i física interdisciplinària<\/td><td>39<\/td><td>21<\/td><\/tr><tr><td><strong>Quàntica i Interaccions Fonamentals<\/strong><\/td><td>Relativitat Especial i Camps Clàssics · Mecànica Teòrica · Física Atòmica i Molecular · Física Nuclear i Hadrònica · Física de Partícules · Laboratori de menció<\/td><td>36<\/td><td>24<\/td><\/tr><tr><td><strong>Tecnologies Físiques<\/strong><\/td><td>Instrumentació Física · Física de l’Estat Sòlid · Física Atòmica i Molecular · Fotònica · Física de Semiconductors · Laboratori de Tecnologies Físiques<\/td><td>36<\/td><td>24<\/td><\/tr><\/table><\/div>\n<p>Moltes assignatures es repeteixen entre mencions (Mecànica Teòrica en tres, Física Atòmica i Molecular en tres). Això és el que permet canviar de menció sense perdre crèdits.<\/p>\n<p>Abreviatures que es fan servir més avall: <strong>Astro<\/strong> = Astrofísica · <strong>Terra<\/strong> = Física del Sistema Terra · <strong>MCSC<\/strong> = Matèria Condensada i Sistemes Complexos · <strong>QIF<\/strong> = Quàntica i Interaccions Fonamentals · <strong>TF<\/strong> = Tecnologies Físiques.<\/p>\n<figure class=\"w\" data-w=\"menmap\"><span class=\"live\">interactiu<\/span><div class=\"mount\"><\/div><figcaption>Mapa del grau amb les obligatòries de cada menció a 3r i 4t. Les optatives inclouen les de menció, les d’altres mencions i les transversals.<\/figcaption><\/figure>\n<figure class=\"w\" data-w=\"menopt\"><span class=\"live\">interactiu<\/span><div class=\"mount\"><\/div><figcaption>Optatives pròpies de cada menció; les que són obligatòries en una altra menció ho indiquen.<\/figcaption><\/figure>\n<h3 id=\"f-que-comparteixen-les-mencions\">Què comparteixen les mencions<\/h3>\n<figure class=\"w\" data-w=\"euler\"><span class=\"live\">interactiu<\/span><div class=\"mount\"><\/div><figcaption>Diagrama de conjunts de les mencions (interactiu)<\/figcaption><\/figure>\n<p>Com llegir-lo: clica les mencions de la llegenda per mostrar només les que vulguis comparar (per exemple, Astrofísica i Quàntica); les assignatures que no pertanyen a cap de les seleccionades queden en gris i el comptador indica quantes en comparteixen. Cada assignatura és dins dels contorns de totes les mencions a què pertany. Si a més cau a la zona ombrejada d’una menció, hi és obligatòria. Atòmica i Molecular, al centre, és a les cinc.<\/p>\n<figure class=\"w\" data-w=\"red\"><div class=\"mount\"><\/div><figcaption>Assignatures compartides entre mencions · presentació del nou grau<\/figcaption><\/figure>\n<figure class=\"w\" data-w=\"matriz\"><span class=\"live\">interactiu<\/span><div class=\"mount\"><\/div><figcaption>Les 46 assignatures de menció · presentació del nou grau<\/figcaption><\/figure>\n<p>Les assignatures de dalt són les que connecten mencions: Física Atòmica i Molecular és a les cinc i Mecànica Teòrica a quatre. Les de baix són les que donen identitat a cadascuna. Clica una menció (als botons o a la capçalera de la seva columna) per ordenar la taula des d’ella: a dalt surten les seves obligatòries, i la fila de resum indica quants d’aquests ECTS compten també a cadascuna de les altres mencions.<\/p>\n<p>A més de les 46 assignatures de menció hi ha <strong>optatives transversals<\/strong>, que no pertanyen a cap menció i compten com a crèdits lliures: Història de la Física (6), Pràctiques en Empresa (6), Gènere, Ciència i Tecnologia (3) i, per confirmar, Didàctica de la Ciència (3). Fonaments Científics del Canvi Climàtic (3), obligatòria a Terra, també s’ofereix com a transversal.<\/p>\n<h2 id=\"f-canviar-de-mencio\">Canviar de menció<\/h2>\n<figure class=\"w\" data-w=\"viab\"><span class=\"live\">interactiu<\/span><div class=\"mount\"><\/div><figcaption>Viabilitat del canvi de menció (interactiu: 5è / 6è semestre)<\/figcaption><\/figure>\n<ul><li><strong>Com llegir-la:<\/strong> clica el botó del moment del canvi (després del 5è o després del 6è semestre). Fila = menció en què va començar l’estudiant; columna = la menció a la qual vol canviar. Cada cel·la indica quants ECTS de les assignatures fixes de menció ja cursades continuen comptant. Passa el ratolí per sobre d’una cel·la (o toca-la) per veure a sota quines assignatures compten, com a obligatòria o optativa de la destinació, i quines no.<\/li><li><strong>Després del 5è semestre<\/strong> el canvi és viable en les 20 combinacions: només s’han cursat 6–12 ECTS de menció i queden 75 ECTS optatius.<\/li><li><strong>Després del 6è semestre<\/strong> és viable en 18 de 20: només fallen Terra → QIF i Terra → TF.<\/li><li>El que no compta per a la nova menció no es perd: va als 27 ECTS lliures.<\/li><li>Si el canvi arriba tard i no es completen els 60 ECTS, queda l’<strong>itinerari lliure<\/strong>: s’obté el títol amb els mateixos coneixements, sense el nom de la menció.<\/li><li>Les optatives de 3r que triï l’estudiant poden millorar molt aquestes xifres si ja dubta entre dues mencions.<\/li><\/ul>\n", "ftoc": [["f-mapa-del-grau", "Mapa del grau"], ["f-les-materies-troncals", "Les matèries troncals"], ["f-laboratoris", "Laboratoris"], ["f-com-es-construeix-una-mencio", "Com es construeix una menció"], ["f-les-cinc-mencions", "Les cinc mencions"], ["f-canviar-de-mencio", "Canviar de menció"]]}};
